<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2>cadastro de usuário</h2>
    <p>preencha os campos abaixo para criar sua conta</p>
    <label for="name">nome:</label>
    <input type="text" id="name" name="name"
    placeholder="digite seu nome completo">
    
    <label for="E-mail">E-mail</label>
    <input type="text" id="E-mail" name="E-mail"
    placeholder="digite seu e-mail">
    <br><br>

    <label for="password">senha*</label>
    <br>
    <input type="password" id="password"name="password" 
     placeholder="digite sua senha" minlength="10">
     <br><br>

     <label for="password">confirmar senha*</label>
     <br>
     <input type="password" id="password" name="password"
      placeholder="confirme a sua senha">
     <br><br>

     <label for="date">Data de nascimento*</label>
     <br>
     <input type="date" name="date" id="date">

     <label for="idade">idade*</label>
     <input type="number" name="idade" id="idade"
     placeholder="ex: 20">
     <br><br>

     <label for="sexo">sexo*</label>
     <br>
     <label for="sexo">masculino</label>
     <input type="radio" name="sexo" id="sexo">

      <label for="sexo">feminino</label>
     <input type="radio" name="sexo" id="sexo">

      <label for="sexo">outros</label>
     <input type="radio" name="sexo" id="sexo">

     <label for="estado">estado*</label>
     <select id="cidade" name="cidade">
     <option value="teresina">teresina</option>
     <option value="parnaiba">parnaiba</option>
     <option value="picos">picos</option>
     <option value="piripiri">piripiri</option>
     <option value="floriano">floriano</option>
     </select>
      <br><br>
     <label for="interesses">interesses(selecione um ou mais)</label>
     <br>
     <input type="checkbox" name="interesses" id="interesses">
     <label for="interesses">tecnologia</label>

      <input type="checkbox" name="interesses" id="interesses">
      <label for="interesses">esportes</label>
     

      <input type="checkbox" name="interesses" id="interesses">
      <label for="interesses">música</label>
     

       <input type="checkbox" name="interesses" id="interesses">
       <label for="interesses">leitura</label>
     

       <input type="checkbox" name="interesses" id="interesses">
       <label for="interesses">viagens</label>
     
       
       <input type="checkbox" name="interesses" id="interesses">
       <label for="interesses">games</label>
        <br><br>

        <label for="sobre voce">sobre voce*</label>
        <br>
        <input type="text" name="sobre voce" id="sobre voce"
        placeholder="fale um pouco sobre voce">
        <br><br>

         <input type="checkbox">
         <label for="aceitação">Li e aceito os termos de uso e a politica de privacidade</label>
         <br><br>

        <button>cadastrar</button>
</body>
</html>
