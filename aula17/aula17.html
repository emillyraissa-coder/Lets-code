<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        font-family: arial, sans serif;
        background-color: rgb(255, 255, 255);
        padding:20px;
        box-sizing: border-box;
    }
    div{
        margin: 0 10px;
    }
    .quadrado, .quadrado2, .quadrado3, .quadrado4, 
    .quadrado5, .quadrado6, .quadrado7, .quadrado8{
        display: flex;
        align-items: center;
        margin-bottom: 15px;
        width: 90%;
        border: rgb(144, 141, 141) solid 2px;
        border-radius: 10px;
        padding: 10px;
        background-color: rgb(220, 219, 219);
    }
    .quadrado {
        justify-content: start;
    }

    .quadrado2 {
        justify-content: end;
    }

    .quadrado3 {
        justify-content: space-between;
    }

    .quadrado4 {
        justify-content: space-around;
    }

    .quadrado5 {
        justify-content: center;
    }

    .quadrado6 {
        justify-content: space-evenly;
    }

    .quadrado7 {
        justify-content: space-between;
    }

    .quadrado8 {
        justify-content: space-around;
    }

    .vermelho {
        width: 40px;
        height: 40px;
        background-color: brown;
        border-radius: 5px;
    }

    .azul {
        width: 40px;
        height: 40px;
        background-color: rgb(22, 41, 207);
        border-radius: 5px;
    }

    .verde {
        width: 40px;
        height: 40px;
        background-color: rgb(78, 199, 29);
        border-radius: 5px;
    }

    .laranja {
        width: 40px;
        height: 40px;
        background-color: rgb(199, 131, 29);
        border-radius: 5px;
    }
    
</style>

<body>
    <div class="quadrado">

        <div class="verde"></div>
        <div class="laranja"></div>
