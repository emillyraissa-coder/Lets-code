<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
    <style>
        .cubos{
            width: 800px;
            height: 600px;
            border: 5px solid;
            margin: 40px auto;
            position: relative;
        }

        body{
            text-align: center;
            font-weight: bold;
            color: white;

        }
        .red{
            float: left;
            background-color: red;
            margin: 40px;
            position: relative;
            width: 200px;
            height: 200px;
            top: 20px;
            right: 20px;
        }
        .gren{
            float:right;
            background-color: rgb(40, 226, 40);
            margin: 40px;
            position: relative;
            width: 200px;
            height: 200px;
            top: 20px;
            right: 20px;
        }
        .footer{
            background-color: rgb(146, 146, 142);
            margin: 40px;
            top: 220px;
            right: 20px;
            width: 200px;
            height: 200px;
            position: absolute;
            left: 250px;
        }
     
        .blue{
            float: left;
            background-color: blue;
            width: 200px;
            height: 200px;
            top: 20px;
            right: 20px;
            margin:60px;
            position: relative;
        }
        .purple{
            float: right;
            background-color: blueviolet;
            margin: 60px;
            top: 20px;
            width: 200px;
            height: 200px;
            position: relative;
            
        }
        

    </style>
<body>
    <main class="cubos">
   <div class="red">
    <p>red</p>
   </div>
   <div class="gren">
    <p>gren</p>
   </div>
   <br><br>
   <div class="footer">
    <p>footer</p>
   </div>

   <br><br>
   <div class="blue">
    <p>blue</p>
   </div>
   <div class="purple">
    <p>purple</p>
   </div>
   </main>
</body>
</html>
