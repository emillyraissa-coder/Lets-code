<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Document</title>
</head>
<style>
    p {
        background-color: aqua;
    }

    .destaque {
        background-color: rgb(217, 83, 21);
    }

    #titulo {
        background-color: rgb(73, 146, 214);
    }

    #email {
        background-color: blueviolet;
    }

    .produto p{
        background-color: rgb(198, 17, 143);
        
    }
    h2 {
        background-color: rgb(202, 227, 12);
    }
    body {
        background-color: rgb(90, 117, 180);

    }
    a:hover {
       background-color: rgb(88, 185, 18);
       font-size: 20px;
    }

    a, input {
        display: block;
    }
    
    input {
        margin: 10px 0px;
    }

</style>

<body>
    <h1 id="titulo">Loja Virtual</h1>

    <p class="destaque">
        Aproveite nossas promoções!
    </p>

    <p>
        Entrega para todo o Brasil.
    </p>

    <div class="produto">
        <h2>Notebook</h2>
        <p>Notebook para estudos e trabalho.</p>
    </div>

    <div class="produto">
        <h2>Mouse Gamer</h2>
        <p>Mouse com iluminação RGB.</p>
    </div>

    <a href="https://www.google.com">Google</a>
    <a href="https://www.github.com">GitHub</a>

    <input type="text" placeholder="Digite seu nome">
    <input type="email" placeholder="Digite seu e-mail" id="email">

    <ul>
        <li>Item 1</li>
        <li>Item 2</li>
        <li>Item 3</li>
    </ul>

</body>

</html>
