<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    body {
        background-color: rgb(159, 158, 158);
        font-family: Arial, Helvetica, sans-serif;
    }

    header {
        background-color: rgb(211, 91, 63);
        height: 90px;

    }

    .logo {
        float: left;
        width: 90px;
        height: 45px;
        background-color: palevioletred;
        margin: 20px;
        text-align: center;
        line-height: 45px;
    }

    .navigation {
        float: right;
        width: 150px;
        height: 45px;
        background-color: rgb(235, 151, 7);
        margin: 20px;
        text-align: center;
        line-height: 45px;
    }

    h3 {
        color: black;
        font-size: 16px;
        margin: 0;
    }


    .quadrado {
        color: aliceblue;
    }

    .quadrado1 {
        background-color: rgb(60, 44, 133);
        padding: 10px;
        float: left;
        height: 325px;
        margin-bottom: 20px;


    }

    .quadrado2 {
        background-color: rgb(185, 28, 185);
        display: block;
        padding: 10px;
        float: right;
        height: 140px;
        margin-bottom: 20px;
        width: 70%;
    }

    .quadrado3 {
        background-color: rgb(19, 220, 56);
        display: block;
        padding: 10px;
        float: right;
        height: 140px;
        margin-bottom: 20px;
        width: 70%;
    }

    footer {
        background-color: rgb(215, 186, 16);
        padding: 5px;
        clear: both;
        height: 60px;
        font-weight: bold;
    }

    h2 {
        color: rgb(60, 51, 51);
    }
</style>

<body>
    <header>
        <div class="logo">
            <h3>começo</h3>
        </div>

        <nav class="navigation">
            <h3>depois</h3>
        </nav>
    </header>

    <div class="quadrado">
        <div class="quadrado1">
            <h1>sidebar</h1>
        </div>
        <div class="quadrado2">
            <h1>sub content</h1>
        </div>
        <div class="quadrado3">
            <h1>sub content 2</h1>
        </div>
    </div>

    <footer>
        <h2>footer</h2>
    </footer>
</body>

</html>
